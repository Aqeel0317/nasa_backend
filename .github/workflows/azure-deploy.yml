name: Deploy API to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Deploy only when the publish-profile secret has been added to the repository.
      HAS_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          pip install -r requirements.txt
          pytest -q

      # App Service builds the venv itself (SCM_DO_BUILD_DURING_DEPLOYMENT=true),
      # so only source files are uploaded.
      - name: Deploy
        if: env.HAS_PROFILE == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || 'aapkakhet-api' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
